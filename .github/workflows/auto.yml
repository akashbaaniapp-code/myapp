name: 🤖 AI Auto Update

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'কী করতে চান? (যেমন: "হেডারের রং লাল করো")'
        required: true
        type: string

jobs:
  auto-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🤖 Update File
        run: |
          echo "🔄 Processing: ${{ github.event.inputs.command }}"
          
          # ফাইল চেক করো
          if [ -f "index.html" ]; then
            echo "✅ index.html found"
          else
            echo "❌ index.html not found"
            exit 1
          fi

      - name: 📤 Commit & Push
        run: |
          git config user.name "AI Bot"
          git config user.email "ai-bot@github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "🤖 AI Update: ${{ github.event.inputs.command }}"
          git push || echo "No changes to push"
