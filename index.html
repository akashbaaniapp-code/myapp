<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div id="loginPage" class="login-page">
        <div class="login-box">
            <h1>🔐 ERP System</h1>
            <p>দয়া করে লগইন করুন</p>
            <input type="text" id="username" placeholder="Username" value="admin">
            <input type="password" id="password" placeholder="Password" value="admin123">
            <button onclick="login()">লগইন করুন</button>
            <div id="loginError" class="login-error">❌ ভুল তথ্য!</div>
        </div>
    </div>

    <div id="mainApp" style="display: none; width: 100%; display: none; flex: 1;">
        <div class="sidebar">
            <div class="sidebar-header"><h2>📊 ERP</h2><p>Enterprise System</p></div>
            <div class="sidebar-menu">
                <div class="menu-item" onclick="loadPage('dashboard')"><i class="fas fa-th-large"></i><span>Dashboard</span></div>
                
                <div class="menu-item" onclick="toggleMenu(this)"><i class="fas fa-cog"></i><span>Configuration</span><i class="fas fa-chevron-down" style="margin-left:auto;font-size:0.7em;"></i></div>
                <div class="menu-sub" style="display:block;">
                    <div class="menu-item" onclick="loadPage('entity')"><span>🏢 Entity</span></div>
                    <div class="menu-item" onclick="loadPage('company')"><span>Company</span></div>
                    <div class="menu-item" onclick="loadPage('warehouse')"><span>Warehouse</span></div>
                </div>
                
                <hr style="border-color:#2d3748;margin:10px 20px;">
                <div class="menu-item" onclick="loadPage('purchase')"><i class="fas fa-shopping-cart"></i><span>Purchase</span></div>
                <div class="menu-item" onclick="loadPage('inventory')"><i class="fas fa-boxes"></i><span>Inventory</span></div>
                <div class="menu-item" onclick="loadPage('sales')"><i class="fas fa-chart-line"></i><span>Sales</span></div>
                <div class="menu-item" onclick="loadPage('accounts')"><i class="fas fa-coins"></i><span>Accounts</span></div>
                <div class="menu-item" onclick="loadPage('reports')"><i class="fas fa-file-alt"></i><span>Reports</span></div>
                <div class="menu-item" onclick="loadPage('approval')"><i class="fas fa-check-circle"></i><span>Approval Center</span></div>
            </div>
        </div>

        <div class="main-content">
            <div class="topbar">
                <h1 id="pageTitle">🏠 Dashboard</h1>
                <div class="user-info" onclick="logout()">
                    <div class="user-avatar">A</div>
                    <span>Admin</span>
                    <button class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
                </div>
            </div>
            <div class="content-area" id="contentArea"></div>
        </div>
    </div>

    <script src="assets/js/app.js"></script>
</body>
</html>
